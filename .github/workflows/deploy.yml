name: Deploy & Keep-Alive Aloo

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/25 * * * *"
  workflow_dispatch:

jobs:
  sync-hf:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push --force https://Shivang989:$HF_TOKEN@huggingface.co/spaces/Shivang989/Aloo main

  ping-space:
    runs-on: ubuntu-latest
    steps:
      - name: Ping HF Space to prevent sleep
        run: |
          curl -fsS -m 15 https://shivang989-aloo.hf.space/ || true
